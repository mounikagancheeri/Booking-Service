@if (loading()) {
  <span class="spinner" aria-hidden="true"></span>
} @else if (iconPosition() === 'start') {
  @if (icon(); as name) {
    <app-icon [name]="name" [size]="18" />
  }
}
<span class="label"><ng-content /></span>
@if (!loading() && iconPosition() === 'end') {
  @if (icon(); as name) {
    <app-icon [name]="name" [size]="18" />
  }
}
